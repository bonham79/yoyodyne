model:
  class_path: yoyodyne.models.hard_attention.HardAttentionTransformerModel
  init_args:
    source_encoder:
      class_path: yoyodyne.models.modules.TransformerEncoder
      init_args:
        dropout: 0.3
        embedding_size: 128
        hidden_size: 1024
    decoder_dropout: 0.3
    decoder_hidden_size: 128
    embedding_size: 128
    optimizer:
      class_path: torch.optim.AdamW
      init_args:
        lr: 0.001

data:
  model_dir: /home/salamander/Documents/yoyodyne/model
  train: /home/salamander/Documents/compling/experiments/data/fin/fin_0.tsv
  val: /home/salamander/Documents/compling/experiments/data/fin/fin_1.tsv
